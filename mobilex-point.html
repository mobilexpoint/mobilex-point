<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobilex Point</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Hind Siliguri',sans-serif}
:root{--bg:#f1f5f9;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--primary:#1e5cf5;--green:#059669;--red:#dc2626;--amber:#d97706}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#94a3b8;--border:#334155}
body{background:var(--bg);color:var(--text);font-size:14px}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:var(--card);border-right:1px solid var(--border);position:fixed;top:0;bottom:0;left:0;z-index:40;transform:translateX(-100%);transition:.3s;display:flex;flex-direction:column;overflow-y:auto}
.sidebar.open{transform:translateX(0)}
@media(min-width:900px){.sidebar{transform:translateX(0)}}
.sb-head{padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.logo-icon{width:36px;height:36px;background:var(--primary);color:#fff;border-radius:11px;display:grid;place-items:center;font-weight:700}
.nav{padding:8px;flex:1}
.nav button{width:100%;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--text);text-align:left;margin-bottom:2px;font-family:inherit}
.nav button:hover{background:rgba(30,92,245,.08)}
.nav button.active{background:var(--primary);color:#fff}
.sb-foot{padding:10px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--muted);line-height:1.7}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
@media(min-width:900px){.main{margin-left:250px}}
.header{background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.header h1{font-size:15px;font-weight:700}
.header p{font-size:10px;color:var(--muted)}
.menu-btn{background:var(--bg);border:none;padding:8px;border-radius:9px;cursor:pointer;color:var(--text);font-size:16px}
@media(min-width:900px){.menu-btn{display:none}}
.icon-btn{background:var(--bg);border:none;padding:8px;border-radius:9px;cursor:pointer;color:var(--text);font-size:14px}
.content{padding:14px;flex:1}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px;margin-bottom:12px}
.grid{display:grid;gap:10px}
.grid-2{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.grid-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat-lbl{font-size:11px;color:var(--muted);margin-bottom:4px}
.stat-val{font-size:20px;font-weight:700}
.stat-val.g{color:var(--green)}
.stat-val.r{color:var(--red)}
.stat-val.a{color:var(--amber)}
.stat-hint{font-size:10px;color:var(--muted);margin-top:2px}
h2{font-size:16px;font-weight:700;margin-bottom:10px}
h3{font-size:14px;font-weight:600;margin-bottom:8px}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:9px;font-size:13px;font-family:inherit;outline:none;background:var(--card);color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
.btn{padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;justify-content:center}
.btn:disabled{opacity:.5}
.btn-primary{background:var(--primary);color:#fff}
.btn-ghost{background:var(--bg);color:var(--text)}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:9px 6px;border-bottom:1px solid var(--border);color:var(--muted);font-weight:600;font-size:11px}
td{padding:9px 6px;border-bottom:1px solid var(--border)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:600}
.b-gray{background:rgba(100,116,139,.15);color:var(--muted)}
.b-green{background:rgba(5,150,105,.15);color:var(--green)}
.b-red{background:rgba(220,38,38,.15);color:var(--red)}
.b-blue{background:rgba(30,92,245,.15);color:var(--primary)}
.b-amber{background:rgba(217,119,6,.15);color:var(--amber)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;place-items:center;padding:10px;overflow-y:auto}
.modal-bg.show{display:grid}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:640px;margin:auto;max-height:92vh;overflow-y:auto}
.modal.wide{max-width:900px}
.modal-head{padding:13px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);z-index:1}
.modal-head h3{font-size:15px;font-weight:700}
.modal-body{padding:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.form-grid .full{grid-column:1/-1}
.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:11px 20px;border-radius:11px;font-size:13px;z-index:100;max-width:90%;display:none}
.toast.show{display:block}
.loading{position:fixed;top:0;left:0;right:0;height:3px;background:var(--primary);animation:pl 1s infinite;z-index:200;display:none}
.loading.show{display:block}
@keyframes pl{50%{opacity:.3}}
.empty{text-align:center;padding:24px;color:var(--muted);font-size:13px}
.flex-b{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mb-3{margin-bottom:10px}
.search{position:relative;flex:1;min-width:150px}
.search input{padding-left:32px}
.search::before{content:"🔍";position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:12px;z-index:1;opacity:.6}
.tabs{display:flex;gap:3px;background:var(--bg);border-radius:10px;padding:3px;overflow-x:auto}
.tabs button{border:none;background:transparent;padding:7px 14px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;white-space:nowrap}
.tabs button.active{background:var(--card);color:var(--primary)}
.info-box{background:rgba(30,92,245,.06);border-radius:9px;padding:11px;margin:7px 0;font-size:12px}
.info-box .row{display:flex;justify-content:space-between;padding:3px 0}
.inv-section{font-size:12px;font-weight:700;background:#1e293b;color:#fff;padding:5px 10px;border-radius:5px;margin:10px 0 8px;letter-spacing:1px}
.inv-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dotted #cbd5e1}
.invoice{background:#fff;color:#000;padding:20px;max-width:800px;margin:0 auto}
.inv-head{text-align:center;border-bottom:3px double #000;padding-bottom:12px;margin-bottom:12px}
.inv-head h1{font-size:26px;color:#1e5cf5;font-weight:700}
.inv-head .sub{font-size:12px;color:#475569;letter-spacing:2px;margin-top:2px}
.inv-head .contact{font-size:11px;color:#64748b;margin-top:5px}
.inv-terms{font-size:10px;line-height:1.8;background:#fef9f0;border:1px solid #fed7aa;border-radius:6px;padding:10px}
.inv-sign{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px}
.inv-sign .box{text-align:center;border-top:2px solid #000;padding-top:5px;font-size:11px;font-weight:600}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
@media print{.sidebar,.header,.no-print,.btn{display:none!important}.modal-bg{position:static;background:#fff;padding:0}.modal{max-height:none;box-shadow:none}}
</style>
</head>
<body data-theme="light">
<div class="loading" id="loading"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div style="display:flex;align-items:center;gap:9px">
        <div class="logo-icon">M</div>
        <div><b style="display:block;font-size:14px">Mobilex Point</b><small style="color:var(--muted);font-size:10px">Buy Sell Exchange</small></div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot">📍 Teribazar, Netrakona<br>☎ 01601776617<br>☎ 01915776617</div>
  </aside>

  <div class="main">
    <header class="header no-print">
      <button class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
      <div style="flex:1">
        <h1>Mobilex Point</h1>
        <p id="syncStatus">☁️ Cloud sync active</p>
      </div>
      <button class="icon-btn" onclick="reload()">🔄</button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="modal-bg" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Modal</h3>
      <button class="icon-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
/* ========== CONFIG ========== */
const API_URL = "https://script.google.com/macros/s/AKfycbyK4Sro1zEk2aGS_3EMEO4-5bIhIuMgYriP8hjRDQKv7svBnYycJ6ppdcmfOTz4jDstWg/exec";

const BRANDS = ["Samsung","Xiaomi","Redmi","Poco","Oppo","Vivo","Realme","OnePlus","Apple","Nokia","Infinix","Tecno","Itel","Walton","Symphony","Motorola","Huawei","Honor","Google Pixel","Other"];
const VARIANTS = ["CN","INT","IND INT","BD OFFICIAL","Other"];
const CONDITIONS = ["New","Good","Average","Bad"];
const PAY_METHODS = ["bKash","Nagad","Rocket","Upay","Bank"];
const EXPENSE_CATS = ["Shop Rent","Electricity","Salary","Transport","Mobile Recharge","Repair","Packaging","Zakat","Other"];

let DATA = {inventory:[],sales:[],exchanges:[],customers:[],expenses:[],settings:[]};
let CURRENT_PAGE = "dashboard";

const tk = n => "৳" + Number(n||0).toLocaleString("en-IN");
const todayISO = () => new Date().toISOString().slice(0,10);

/* ========== API ========== */
async function apiGet() {
  try {
    const r = await fetch(API_URL + "?action=getAll");
    const j = await r.json();
    if (j.success) DATA = j.data;
    return j;
  } catch(e) { toast("❌ "+e.message); return null; }
}

async function apiPost(action, data) {
  try {
    const r = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({action, data})
    });
    return await r.json();
  } catch(e) { return {success:false, error:e.message}; }
}

/* ========== UI HELPERS ========== */
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 3500);
}
function showLoading() { document.getElementById('loading').classList.add('show'); }
function hideLoading() { document.getElementById('loading').classList.remove('show'); }

function openModal(title, bodyHTML, wide) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = bodyHTML;
  document.getElementById('modal').className = 'modal' + (wide?' wide':'');
  document.getElementById('modalBg').classList.add('show');
}
function closeModal() { document.getElementById('modalBg').classList.remove('show'); }

/* ========== NAV ========== */
const PAGES = [
  {k:"dashboard", l:"🏠 Dashboard"},
  {k:"buy",       l:"📥 Buy Phone"},
  {k:"sell",      l:"📤 Sell Phone"},
  {k:"exchange",  l:"🔄 Exchange"},
  {k:"inventory", l:"📦 Inventory"},
  {k:"customers", l:"👥 Customers"},
  {k:"expenses",  l:"💸 Expenses"},
  {k:"reports",   l:"📊 Reports"},
  {k:"settings",  l:"⚙️ Settings"}
];

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = PAGES.map(p => 
    `<button class="${CURRENT_PAGE===p.k?'active':''}" onclick="gotoPage('${p.k}')">${p.l}</button>`
  ).join('');
}

function gotoPage(page) {
  CURRENT_PAGE = page;
  renderNav();
  document.getElementById('sidebar').classList.remove('open');
  render();
}

/* ========== RENDER ========== */
function render() {
  const c = document.getElementById('content');
  if (CURRENT_PAGE === "dashboard") c.innerHTML = renderDashboard();
  else if (CURRENT_PAGE === "buy") c.innerHTML = renderBuy();
  else if (CURRENT_PAGE === "sell") c.innerHTML = renderSell();
  else if (CURRENT_PAGE === "exchange") c.innerHTML = renderExchange();
  else if (CURRENT_PAGE === "inventory") c.innerHTML = renderInventory();
  else if (CURRENT_PAGE === "customers") c.innerHTML = renderCustomers();
  else if (CURRENT_PAGE === "expenses") c.innerHTML = renderExpenses();
  else if (CURRENT_PAGE === "reports") c.innerHTML = renderReports();
  else if (CURRENT_PAGE === "settings") c.innerHTML = renderSettings();
}

async function reload() {
  showLoading();
  await apiGet();
  hideLoading();
  render();
  toast("✅ Updated");
}

/* ========== DASHBOARD ========== */
function renderDashboard() {
  const inStock = DATA.inventory.filter(p=>p.Status==="in_stock");
  const totalSale = DATA.sales.reduce((a,s)=>a+Number(s.FinalPrice||0),0);
  const totalProfit = DATA.sales.reduce((a,s)=>a+Number(s.Profit||0),0);
  const totalExp = DATA.expenses.reduce((a,e)=>a+Number(e.Amount||0),0);
  const net = totalProfit - totalExp;
  const stockValue = inStock.reduce((a,p)=>a+Number(p.BuyPrice||0),0);
  const today = todayISO();
  const todaySales = DATA.sales.filter(s=>String(s.SellDate).slice(0,10)===today);
  const todaySale = todaySales.reduce((a,s)=>a+Number(s.FinalPrice||0),0);
  const thisMonth = today.slice(0,7);
  const monthSales = DATA.sales.filter(s=>String(s.SellDate).slice(0,7)===thisMonth);
  const monthSale = monthSales.reduce((a,s)=>a+Number(s.FinalPrice||0),0);

  return `
    <div class="grid grid-4 mb-3">
      <div class="card"><div class="stat-lbl">Today's Sales</div><div class="stat-val g">${tk(todaySale)}</div><div class="stat-hint">${todaySales.length} phone(s)</div></div>
      <div class="card"><div class="stat-lbl">This Month</div><div class="stat-val g">${tk(monthSale)}</div><div class="stat-hint">${monthSales.length} phone(s)</div></div>
      <div class="card"><div class="stat-lbl">Stock</div><div class="stat-val a">${inStock.length} pcs</div><div class="stat-hint">Value ${tk(stockValue)}</div></div>
      <div class="card"><div class="stat-lbl">Net Profit</div><div class="stat-val ${net>=0?'g':'r'}">${tk(net)}</div><div class="stat-hint">Expenses ${tk(totalExp)}</div></div>
    </div>
    <div class="card">
      <h3>Recent Sales</h3>
      ${DATA.sales.length ? DATA.sales.slice(0,5).map(s=>`
        <div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
          <div><b>${s.Brand} ${s.Model}</b><div style="font-size:11px;color:var(--muted)">${s.CustomerName||'Walk-in'}</div></div>
          <div style="text-align:right"><b style="color:var(--primary)">${tk(s.FinalPrice)}</b><div style="font-size:11px;color:${Number(s.Profit)>=0?'var(--green)':'var(--red)'}">${tk(s.Profit)}</div></div>
        </div>
      `).join('') : '<div class="empty">No sales yet</div>'}
    </div>
  `;
}

/* ========== BUY ========== */
let buyTab = "local";
function renderBuy() {
  return `
    <div class="tabs mb-3" style="max-width:400px">
      <button class="${buyTab==='local'?'active':''}" onclick="buyTab='local';render()">🏠 Local Customer</button>
      <button class="${buyTab==='wholesaler'?'active':''}" onclick="buyTab='wholesaler';render()">🏪 Wholesaler</button>
    </div>
    ${buyTab==='local' ? renderLocalBuy() : renderWholesalerBuy()}
  `;
}

function renderLocalBuy() {
  return `
    <div class="card">
      <h2>📥 Local Customer Purchase</h2>
      <div class="inv-section" style="margin-top:0">SELLER INFORMATION</div>
      <div class="form-grid">
        <div><label>Seller Name *</label><input id="sellerName"></div>
        <div><label>Date</label><input type="date" id="buyDate" value="${todayISO()}"></div>
        <div><label>Father's Name</label><input id="fatherName"></div>
        <div><label>Date of Birth</label><input type="date" id="dob"></div>
        <div class="full"><label>Address</label><input id="address"></div>
        <div><label>NID / B.C. No *</label><input id="nid"></div>
        <div><label>Mobile</label><input id="sellerPhone"></div>
      </div>
      <div class="inv-section">PRODUCT INFORMATION</div>
      <div class="form-grid">
        <div><label>Brand *</label><select id="brand"><option value="">-- Select --</option>${BRANDS.map(b=>`<option>${b}</option>`).join('')}</select></div>
        <div><label>Model *</label><input id="model"></div>
        <div><label>RAM / ROM</label><input id="ramRom" placeholder="4GB/64GB"></div>
        <div><label>Variant</label><select id="variant"><option value="">--</option>${VARIANTS.map(v=>`<option>${v}</option>`).join('')}</select></div>
        <div><label>Color</label><input id="color"></div>
        <div><label>Condition</label><select id="condition">${CONDITIONS.map(c=>`<option ${c==='Good'?'selected':''}>${c}</option>`).join('')}</select></div>
        <div><label>IMEI-1 *</label><input id="imei1"></div>
        <div><label>IMEI-2</label><input id="imei2"></div>
        <div><label>Warranty</label><div style="display:flex;gap:5px"><input type="number" id="warrantyNum" placeholder="6" style="max-width:70px"><select id="warrantyUnit"><option>Month</option><option>Day</option></select></div></div>
        <div><label>Buy Price (৳) *</label><input type="number" id="buyPrice"></div>
        <div class="full"><label>Notes</label><textarea id="notes" rows="2"></textarea></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" id="saveBtn" onclick="saveLocalBuy()">💾 Save & Print</button>
      </div>
    </div>
  `;
}

async function saveLocalBuy() {
  const data = {};
  ['sellerName','fatherName','dob','address','nid','sellerPhone','buyDate','brand','model','ramRom','variant','color','imei1','imei2','condition','warrantyNum','warrantyUnit','buyPrice','notes'].forEach(k=>{
    const el = document.getElementById(k);
    if(el) data[k] = el.value;
  });
  if(!data.sellerName || !data.nid || !data.brand || !data.model || !data.imei1 || !data.buyPrice) {
    toast("⚠️ নাম, NID, Brand, Model, IMEI, Price দিন"); return;
  }
  document.getElementById('saveBtn').disabled = true;
  showLoading();
  const r = await apiPost("addPhone", data);
  hideLoading();
  if(r.success) {
    toast("✅ সেভ হয়েছে! Form: "+(r.formNo||''));
    await apiGet();
    renderLocalBuy();
    showLocalPrint(data, r.formNo);
  } else {
    toast("❌ "+(r.error||"Failed"));
    document.getElementById('saveBtn').disabled = false;
  }
}

function showLocalPrint(data, formNo) {
  const policy = [
    "১. NID ফটোকপি ও পাসপোর্ট সাইজের ছবি সংযুক্ত করতে হবে।",
    "২. বিক্রিত পুরোনো সেটের যেকোনো আইনগত সমস্যার দায় Mobilex Point বহন করবে না।",
    "৩. প্রদত্ত পরিমাণ স্বাক্ষরসহ ফেরত দিতে বাধ্য থাকবে না।",
    "৪. পণ্য পরিবর্তনের সম্পূর্ণ অধিকার Mobilex Point সংরক্ষণ করে।",
    "৫. মোবাইল দিয়ে অপরাধমূলক কাজ করলে দায় গ্রাহকের।",
    "৬. কারিগরি সমস্যা ৭ দিনের মধ্যে জানাতে হবে।",
    "৭. এই ফোনের প্রকৃত মালিক আমি — চুরি বা অবৈধ নয়।",
    "৮. ফেরত নিতে চাইলে ৩০% বেশি টাকা দিতে হবে।",
    "৯. উপরোক্ত শর্তাবলী বুঝে শুনে স্বাক্ষর করলাম।"
  ];
  const html = `
    <div class="invoice">
      <div class="inv-head">
        <h1>MOBILEX POINT</h1>
        <div class="sub">BUY • SELL • EXCHANGE</div>
        <div class="contact">📍 Teribazar, Netrakona<br>☎ 01601776617 | 01915776617</div>
      </div>
      <div style="text-align:right;font-size:12px;margin-bottom:8px"><b>Form:</b> ${formNo||''} | <b>Date:</b> ${data.buyDate}</div>
      <div class="inv-section">SELLER</div>
      <div class="inv-row"><span>Name:</span><b>${data.sellerName}</b></div>

let wsPhones = [{}];
function addWsPhone() { wsPhones.push({}); renderPhoneList(); }
function removeWsPhone(i) { wsPhones.splice(i,1); if(!wsPhones.length) wsPhones.push({}); renderPhoneList(); }
function updateWs(i,k,v) { wsPhones[i][k] = v; }
function renderPhoneList() {
  const el = document.getElementById('phoneList');
  if(!el) return;
  el.innerHTML = wsPhones.map((p,i)=>`
    <div style="background:var(--bg);border-radius:10px;padding:11px;margin-bottom:9px;border:1px solid var(--border)">
      <div style="display:flex;justify-content:space-between;margin-bottom:8px">
        <b>📱 Phone #${i+1}</b>
        ${wsPhones.length>1?`<button class="btn btn-danger btn-sm" onclick="removeWsPhone(${i})">Remove</button>`:''}
      </div>
      <div class="form-grid">
        <div><label>Brand *</label><select onchange="updateWs(${i},'brand',this.value)"><option value="">--</option>${BRANDS.map(b=>`<option ${p.brand===b?'selected':''}>${b}</option>`).join('')}</select></div>
        <div><label>Model *</label><input value="${p.model||''}" onchange="updateWs(${i},'model',this.value)"></div>
        <div><label>IMEI-1 *</label><input value="${p.imei1||''}" onchange="updateWs(${i},'imei1',this.value)"></div>
        <div><label>IMEI-2</label><input value="${p.imei2||''}" onchange="updateWs(${i},'imei2',this.value)"></div>
        <div><label>RAM/ROM</label><input value="${p.ramRom||''}" onchange="updateWs(${i},'ramRom',this.value)"></div>
        <div><label>Variant</label><select onchange="updateWs(${i},'variant',this.value)"><option value="">--</option>${VARIANTS.map(v=>`<option ${p.variant===v?'selected':''}>${v}</option>`).join('')}</select></div>
        <div><label>Color</label><input value="${p.color||''}" onchange="updateWs(${i},'color',this.value)"></div>
        <div><label>Condition</label><select onchange="updateWs(${i},'condition',this.value)">${CONDITIONS.map(c=>`<option ${p.condition===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div><label>Buy Price *</label><input type="number" value="${p.buyPrice||''}" onchange="updateWs(${i},'buyPrice',this.value)"></div>
      </div>
    </div>
  `).join('');
}

async function saveWholesale() {
  const header = {
    sellerName: document.getElementById('wsellerName').value,
    shopName: document.getElementById('wshopName').value,
    sellerPhone: document.getElementById('wsellerPhone').value,
    address: document.getElementById('waddress').value,
    buyDate: document.getElementById('wbuyDate').value
  };
  if(!header.sellerName) { toast("⚠️ Seller Name দিন"); return; }
  const valid = wsPhones.every(p=>p.brand && p.model && p.imei1 && p.buyPrice);
  if(!valid) { toast("⚠️ প্রতিটি ফোনে Brand, Model, IMEI, Price দিন"); return; }
  document.getElementById('wsaveBtn').disabled = true;
  showLoading();
  const r = await apiPost("addBulkPhones", {...header, phones: wsPhones});
  hideLoading();
  if(r.success) {
    toast(`✅ ${r.count} টি ফোন সেভ হয়েছে!`);
    wsPhones = [{}];
    await apiGet();
    renderWholesalerBuy();
    renderPhoneList();
  } else {
    toast("❌ "+(r.error||"Failed"));
    document.getElementById('wsaveBtn').disabled = false;
  }
}

  const list = DATA.inventory.filter(p=>p.Status==="in_stock").filter(p=>!q || ((p.Brand||'')+(p.Model||'')+(p.IMEI1||'')).toLowerCase().includes(q.toLowerCase()));

function calcSell(buyPrice) {
  const price = Number(document.getElementById('sPrice').value||0);
  const disc = Number(document.getElementById('sDiscount').value||0);
  const total = price - disc;
  const profit = total - Number(buyPrice);
  document.getElementById('totalBox').innerHTML = `Total: <b style="color:var(--primary)">${tk(total)}</b> | Profit: <b style="color:${profit>=0?'var(--green)':'var(--red)'}">${tk(profit)}</b>`;
}

async function saveSale(phoneId) {
  const data = {
    phoneId: phoneId,
    sellingPrice: document.getElementById('sPrice').value,
    discount: document.getElementById('sDiscount').value,
    cashAmount: document.getElementById('sCash').value,
    mfsAmount: document.getElementById('sMfs').value,
    mfsMethod: document.getElementById('sMfsMethod').value,
    mfsTrxId: document.getElementById('sTrxId').value,
    dueAmount: document.getElementById('sDue').value,
    dueDate: document.getElementById('sDueDate').value,
    warrantyType: document.getElementById('sWarrantyType').value,
    warrantyNum: document.getElementById('sWarrantyNum').value,
    warrantyUnit: document.getElementById('sWarrantyUnit').value,
    customerName: document.getElementById('sCustName').value,
    customerPhone: document.getElementById('sCustPhone').value,
    customerAddress: document.getElementById('sCustAddress').value,
    sellDate: document.getElementById('sSellDate').value
  };
  if(!data.sellingPrice) { toast("⚠️ Selling Price দিন"); return; }
  if(!data.customerName) { toast("⚠️ Customer Name দিন"); return; }

  showLoading();
  const r = await apiPost("addSale", data);

    await apiGet();

  } else {
    toast("❌ "+(r.error||"Failed"));
    document.getElementById('sellBtn').disabled = false;
  }
}

  const html = `
    <div class="form-grid">
      <div class="full"><label>Title *</label><input id="expTitle"></div>
      <div><label>Amount * (৳)</label><input type="number" id="expAmount"></div>
      <div><label>Category</label><select id="expCategory">${EXPENSE_CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <div><label>Payment</label><select id="expPayment"><option>Cash</option><option>bKash</option><option>Nagad</option><option>Bank</option></select></div>
      <div><label>Date</label><input type="date" id="expDate" value="${todayISO()}"></div>
      <div class="full"><label>Notes</label><textarea id="expNotes" rows="2"></textarea></div>
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="expBtn" onclick="saveExpense()">Save</button>
    </div>
  `;
  openModal("New Expense", html);
}

async function saveExpense() {
  const data = {
    title: document.getElementById('expTitle').value,
    amount: document.getElementById('expAmount').value,
    category: document.getElementById('expCategory').value,
    paymentMethod: document.getElementById('expPayment').value,
    date: document.getElementById('expDate').value,
    notes: document.getElementById('expNotes').value
  };
  if(!data.title || !data.amount) { toast("⚠️ Title ও Amount দিন"); return; }
  document.getElementById('expBtn').disabled = true;
  showLoading();
  const r = await apiPost("addExpense", data);
  hideLoading();
  if(r.success) {
    toast("✅ খরচ সেভ হয়েছে");
    closeModal();
    await apiGet();
    render();
  } else {
    toast("❌ "+(r.error||"Failed"));
    document.getElementById('expBtn').disabled = false;
  }
}

async function deleteExp(id) {
  if(!confirm("Delete?")) return;
  showLoading();
  const r = await apiPost("deleteRow", {sheet:"Expenses", id:id});
  hideLoading();
  if(r.success) { toast("✅ Deleted"); await apiGet(); render(); }
}

/* ========== REPORTS ========== */
function renderReports() {
  const totalSale = DATA.sales.reduce((a,s)=>a+Number(s.FinalPrice||0),0);
  const totalCost = DATA.sales.reduce((a,s)=>a+Number(s.BuyPrice||0),0);
  const gross = totalSale - totalCost;
  const totalExp = DATA.expenses.reduce((a,e)=>a+Number(e.Amount||0),0);
  const net = gross - totalExp;
  return `
    <div class="grid grid-4 mb-3">
      <div class="card"><div class="stat-lbl">Total Sales</div><div class="stat-val g">${tk(totalSale)}</div></div>
      <div class="card"><div class="stat-lbl">Total Cost</div><div class="stat-val a">${tk(totalCost)}</div></div>
      <div class="card"><div class="stat-lbl">Gross Profit</div><div class="stat-val g">${tk(gross)}</div></div>
      <div class="card"><div class="stat-lbl">Net Profit</div><div class="stat-val ${net>=0?'g':'r'}">${tk(net)}</div></div>
    </div>
    <div class="card">
      <h3>All Sales (${DATA.sales.length})</h3>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Date</th><th>Phone</th><th>Customer</th><th>Amount</th><th>Profit</th></tr></thead>
          <tbody>
            ${DATA.sales.length ? DATA.sales.slice(0,50).map(s=>`
              <tr><td>${s.SellDate}</td><td>${s.Brand} ${s.Model}</td><td>${s.CustomerName}</td><td><b>${tk(s.FinalPrice)}</b></td><td style="color:${Number(s.Profit)>=0?'var(--green)':'var(--red)'}">${tk(s.Profit)}</td></tr>
            `).join('') : '<tr><td colspan="5" class="empty">No sales yet</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

/* ========== SETTINGS ========== */
function renderSettings() {
  const s = {};
  DATA.settings.forEach(x => s[x.Key] = x.Value);
  return `
    <div class="card">
      <h2>⚙️ Settings</h2>
      <div class="form-grid">
        <div class="full"><label>Shop Name</label><input id="setShopName" value="${s.ShopName||'Mobilex Point'}"></div>
        <div class="full"><label>Subtitle</label><input id="setShopSubtitle" value="${s.ShopSubtitle||'Buy Sell Exchange'}"></div>
        <div class="full"><label>Address</label><input id="setShopAddress" value="${s.ShopAddress||'Teribazar, Netrakona'}"></div>
        <div class="full"><label>Phones</label><input id="setShopPhones" value="${s.ShopPhones||'01601776617, 01915776617'}"></div>
        <div class="form-actions"><button class="btn btn-primary" onclick="saveSettings()">Save</button></div>
      </div>
    </div>
    <div class="card" style="font-size:11px;color:var(--muted);line-height:1.8">
      <div>© Mobilex Point — Teribazar, Netrakona</div>
      <div>Version 3.0</div>
    </div>
  `;
}

async function saveSettings() {
  const data = {
    ShopName: document.getElementById('setShopName').value,
    ShopSubtitle: document.getElementById('setShopSubtitle').value,
    ShopAddress: document.getElementById('setShopAddress').value,
    ShopPhones: document.getElementById('setShopPhones').value
  };
  showLoading();
  const r = await apiPost("updateSettings", data);
  hideLoading();
  if(r.success) { toast("✅ Settings saved"); await apiGet(); }
  else toast("❌ Failed");
}

/* ========== START ========== */
window.addEventListener('load', async () => {
  renderNav();
  showLoading();
  const r = await apiGet();
  hideLoading();
  if(r && r.success) {
    document.getElementById('syncStatus').textContent = "☁️ Connected to Google Sheet";
    render();
  } else {
    document.getElementById('syncStatus').textContent = "❌ Connection failed";
    document.getElementById('content').innerHTML = '<div class="card"><div class="empty">❌ Google Sheet-এ connect করা যায়নি।<br><br>API URL চেক করুন।</div></div>';
  }
});
</script>
</body>
</html>
